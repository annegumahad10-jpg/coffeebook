 <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SHEIN BOOKING</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ====== BODY & CONTAINER ====== */
body {
  margin:0;
  font-family:'Baloo 2',cursive;
  background:#fdfdfd; /* whitish background */
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:10px;
}

.container {
  background:#ffffff;
  padding:20px 15px;
  border-radius:20px;
  width:100%;
  max-width:480px;
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
  text-align:center;
  box-sizing:border-box;
  overflow:auto;
  max-height:95vh;
}

/* ====== TEXT & BUTTONS ====== */
h1 { color:#7b2e1f; margin-bottom:15px; font-size:24px; }
button {
  width:100%;
  padding:14px;
  margin:10px 0;
  border:none;
  border-radius:15px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(45deg,#8b3a2b,#a94432);
  color:white;
  transition:0.3s;
}
button:hover { transform: scale(1.03); }

/* ====== INPUTS ====== */
input, textarea, select {
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:12px;
  border:1.5px solid #d9a38f;
  outline:none;
  font-size:14px;
  box-sizing:border-box;
  font-family:'Baloo 2',cursive;
}
textarea { resize:vertical; min-height:50px; }

.sku-input {
  margin-bottom:8px;
  border-bottom:1px dashed #c58a74;
  padding-bottom:6px;
  display:flex;
  flex-direction:column;
  gap:5px;
}

.total-price {
  font-weight:bold;
  margin-top:8px;
  color:#8b3a2b;
  font-size:16px;
}

/* ====== QR IMAGE ====== */
img {
  max-width:250px;
  width:100%;
  height:auto;
  border-radius:15px;
  margin:10px 0;
  box-shadow:0 6px 15px rgba(0,0,0,0.2);
}

/* ====== PROCESSING SCREEN ====== */
.processing-screen {
  position:fixed;
  inset:0;
  background:rgba(92,44,31,0.95);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  color:white;
  font-size:22px;
  text-align:center;
  z-index:9999;
}
.loader {
  margin-top:20px;
  width:50px;
  height:50px;
  border:5px solid #fff;
  border-top:5px solid #ffccaa;
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin { 100% { transform: rotate(360deg); } }
.success { color:#ffe6cc; font-size:22px; margin-top:15px; }

/* ====== ADMIN ORDER ====== */
.admin-order {
  border-bottom:1px dashed #8b3a2b;
  padding:8px 0;
  text-align:left;
}
.admin-order input, .admin-order textarea {
  width:100%;
  margin:5px 0;
  padding:6px;
  border-radius:8px;
  border:1px solid #c58a74;
  font-family:'Baloo 2',cursive;
}
.confirm-btn { background:#7b2e1f; color:white; margin-top:5px; }
.delete-btn { background:#a94432; color:white; margin-top:5px; }

/* ====== MOBILE ====== */
@media(max-width:480px){
  h1 { font-size:22px; }
  button { font-size:15px; padding:12px; }
  .total-price { font-size:15px; }
}
</style>
</head>
<body>

<!-- HOME -->
<div class="container" id="home">
  <h1>☕ SHEIN BOOKING 🤎</h1>
  <button id="btnPlace">Place Order</button>
  <button id="btnStatus">Check My Order</button>
  <button id="btnAdmin">Admin Panel</button>
</div>

<!-- PLACE ORDER -->
<div class="container" id="place" style="display:none;">
  <h1>🛍️ Place Order</h1>
  <input type="text" placeholder="Full Name" id="name" required>
  <input type="text" placeholder="Address" id="address" required>
  <input type="text" placeholder="Phone Number (11 digits)" id="phone" maxlength="11" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
  <input type="text" placeholder="Zip Code (max 5 digits)" id="zip" maxlength="5" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
  <textarea placeholder="Note for booking (optional)" id="note"></textarea>
  <input type="number" placeholder="How many items?" id="itemCount" min="1">
  <div id="skuInputs"></div>

  <div class="total-price" id="totalPrice">Total: ₱0</div>
  <p>Scan QR Code to Pay 💳</p>
  <img id="qrImage" src="https://i.imgur.com/PquwwgW.jpeg">
  <input type="text" placeholder="Enter Payment Reference Number" id="ref" required>
  <button id="btnSubmit">Submit Order</button>
  <button id="btnBackPlace">Back</button>
</div>

<!-- ORDER STATUS -->
<div class="container" id="status" style="display:none;">
  <h1>📦 Order Status</h1>
  <input type="text" placeholder="Enter Your Name" id="searchName">
  <button id="btnCheckStatus">Check</button>
  <div id="statusResult"></div>
  <button id="btnBackStatus">Back</button>
</div>

<!-- ADMIN PANEL -->
<div class="container" id="admin" style="display:none;">
  <h1>🔐 Admin Login</h1>
  <input type="password" placeholder="Admin Password" id="adminPassword" required>
  <button id="btnAdminLogin">Login</button>
  <button id="btnBackAdmin">Back</button>

  <div id="adminPanel" style="display:none;">
    <h3>Orders</h3>
    <div id="adminOrders"></div>
    <button id="btnChangePass">Change Password</button>
    <button id="btnAdminLogout">Logout</button>
  </div>
</div>

<!-- PROCESSING SCREEN -->
<div class="processing-screen" id="processingScreen">
  <div id="processingText">☕ PROCESSING PLEASE WAIT...</div>
  <div class="loader"></div>
  <div class="success" id="successText" style="display:none;">
    🤎 YOUR ORDER HAS BEEN SUBMITTED SUCCESSFULLY!
  </div>
</div>

<script>
// ==== NAVIGATION ====
function showPage(page){
  document.querySelectorAll('.container').forEach(c => c.style.display='none');
  document.getElementById(page).style.display='block';
  if(page==="status"){ document.getElementById("searchName").value=""; document.getElementById("statusResult").innerHTML=""; }
}
document.getElementById("btnPlace").addEventListener("click",()=>showPage('place'));
document.getElementById("btnStatus").addEventListener("click",()=>showPage('status'));
document.getElementById("btnAdmin").addEventListener("click",()=>showPage('admin'));
document.getElementById("btnBackPlace").addEventListener("click",()=>showPage('home'));
document.getElementById("btnBackStatus").addEventListener("click",()=>showPage('home'));
document.getElementById("btnBackAdmin").addEventListener("click",()=>showPage('home'));

// ==== PRICES & DYNAMIC SKU ====
const priceMap={ "70%":35,"73%":45 };
document.getElementById("itemCount").addEventListener("input", function(){
  const count=parseInt(this.value);
  const skuDiv=document.getElementById("skuInputs");
  skuDiv.innerHTML="";
  if(count>0){
    for(let i=1;i<=count;i++){
      const div=document.createElement("div");
      div.className="sku-input";
      div.innerHTML=`
        <input type="text" placeholder="SKU #${i}" class="sku">
        <input type="text" placeholder="Size (optional)" class="skuSize">
        <input type="text" placeholder="Color (optional)" class="skuColor">
        <select class="voucher">
          <option value="">Select Voucher</option>
          <option value="70%">70% - ₱35</option>
          <option value="73%">73% - ₱45</option>
        </select>`;
      skuDiv.appendChild(div);
    }
    updateTotal();
    skuDiv.querySelectorAll(".voucher").forEach(s=>s.addEventListener("change",updateTotal));
  }
});
function updateTotal(){
  const vouchers=[...document.querySelectorAll(".voucher")];
  let total=0;
  vouchers.forEach(v=>{ if(v.value) total+=priceMap[v.value]; });
  document.getElementById("totalPrice").innerText=`Total: ₱${total}`;
}

// ==== LOCALSTORAGE ====
function getOrders(){ return JSON.parse(localStorage.getItem("orders")||"[]"); }
function saveOrders(orders){ localStorage.setItem("orders",JSON.stringify(orders)); }

// ==== SUBMIT ORDER ====
document.getElementById("btnSubmit").addEventListener("click",()=>{
  const name=document.getElementById("name").value.trim();
  const address=document.getElementById("address").value.trim();
  const phone=document.getElementById("phone").value.trim();
  const zip=document.getElementById("zip").value.trim();
  const ref=document.getElementById("ref").value.trim();
  const note=document.getElementById("note").value.trim();

  if(phone.length!==11){ alert("Phone number must be 11 digits!"); return; }
  if(zip.length>5){ alert("Zip code cannot exceed 5 digits!"); return; }
  if(!ref){ alert("Payment Reference Number is required!"); return; }

  const skuElems=document.querySelectorAll(".sku-input");
  const skus=[];
  for(const e of skuElems){
    const sku=e.querySelector(".sku").value.trim();
    const size=e.querySelector(".skuSize").value.trim()||"-";
    const color=e.querySelector(".skuColor").value.trim()||"-";
    const voucher=e.querySelector(".voucher").value;
    if(!sku||!voucher){ alert("Please complete SKU and select voucher for all items!"); return; }
    skus.push({sku,size,color,voucher,price:priceMap[voucher]});
  }

  const total=skus.reduce((a,b)=>a+b.price,0);
  const orders=getOrders();
  orders.push({id:Date.now(),name,address,phone,zip,ref,note,skus,total,status:"PENDING",adminNote:""});
  saveOrders(orders);

  const screen=document.getElementById("processingScreen");
  const success=document.getElementById("successText");
  const text=document.getElementById("processingText");
  screen.style.display="flex"; success.style.display="none"; text.style.display="block";
  setTimeout(()=>{
    text.style.display="none"; success.style.display="block";
    setTimeout(()=>{
      screen.style.display="none";
      showPage('home');
      document.getElementById("place").querySelectorAll("input,textarea").forEach(i=>i.value="");
      document.getElementById("skuInputs").innerHTML=""; 
      document.getElementById("totalPrice").innerText="Total: ₱0";
    },2000);
  },2000);
});

// ==== ADMIN ====
let ADMIN_PASSWORD="anne1234";
document.getElementById("btnAdminLogin").addEventListener("click",()=>{
  const input=document.getElementById("adminPassword").value.trim();
  if(input===ADMIN_PASSWORD){
    document.getElementById("adminPanel").style.display="block";
    document.getElementById("adminPassword").value="";
    displayAdminOrders();
  }else alert("Incorrect password! Try again.");
});
document.getElementById("btnAdminLogout").addEventListener("click",()=>{
  document.getElementById("adminPanel").style.display="none";
  showPage('home');
});
document.getElementById("btnChangePass").addEventListener("click",()=>{
  const current=prompt("Enter current password:");
  if(current!==ADMIN_PASSWORD){ alert("Wrong current password!"); return; }
  const newPass=prompt("Enter new password:");
  if(newPass){ ADMIN_PASSWORD=newPass; alert("Password changed successfully."); }
});

function displayAdminOrders(){
  let orders=getOrders();
  const container=document.getElementById("adminOrders"); container.innerHTML="";
  if(orders.length===0){ container.innerHTML="<p>No orders yet.</p>"; return; }
  orders.forEach(order=>{
    const div=document.createElement("div"); div.className="admin-order";
    div.innerHTML=`
      <strong>Name:</strong> ${order.name}<br>
      <strong>Address:</strong> ${order.address}<br>
      <strong>Phone:</strong> ${order.phone}<br>
      <strong>Zip:</strong> ${order.zip}<br>
      <strong>Payment Ref:</strong> ${order.ref}<br>
      <strong>Customer Note:</strong> ${order.note||"-"}<br>
      <strong>SKUs:</strong> ${order.skus.map(s=>s.sku+"("+s.voucher+")").join(", ")}<br>
      <strong>Total:</strong> ₱${order.total}<br>
      <strong>Status:</strong> ${order.status}<br>
      <strong>Admin Note (tracking):</strong><br>
      <textarea class="adminNote" placeholder="Enter tracking note">${order.adminNote||""}</textarea>
      <button class="confirm-btn">Confirm Order</button>
    `;
    container.appendChild(div);

    div.querySelector(".confirm-btn").addEventListener("click",()=>{
      const noteField=div.querySelector(".adminNote"); const noteVal=noteField.value.trim();
      if(!noteVal){ alert("Please enter tracking note before confirming!"); return; }
      order.adminNote=noteVal; order.status="CONFIRMED";
      // remove confirmed order from pending list
      orders=orders.filter(o=>!(o.id===order.id && o.status==="CONFIRMED"));
      orders.push(order); saveOrders(orders);
      alert(`Order for ${order.name} confirmed!`);
      displayAdminOrders();
    });
  });
}

// ==== CUSTOMER ORDER STATUS ====
document.getElementById("btnCheckStatus").addEventListener("click",()=>{
  const name=document.getElementById("searchName").value.trim();
  let orders=getOrders().filter(o=>o.name.toLowerCase()===name.toLowerCase());
  const result=document.getElementById("statusResult"); result.innerHTML="";
  if(orders.length===0){ result.innerHTML="<p>No orders found.</p>"; return; }

  orders.forEach(order=>{
    const div=document.createElement("div"); 
    div.style.borderBottom="1px dashed #8b3a2b"; div.style.padding="5px 0";
    div.innerHTML=`
      <strong>Name:</strong> ${order.name}<br>
      <strong>Payment Ref:</strong> ${order.ref}<br>
      <strong>SKUs:</strong> ${order.skus.map(s=>s.sku+"("+s.voucher+")").join(", ")}<br>
      <strong>Total:</strong> ₱${order.total}<br>
      <strong>Status:</strong> ${order.status}<br>
      ${order.status==="CONFIRMED"?`<strong>Tracking Note:</strong> ${order.adminNote||"-"}<br>`:""}
      <button class="delete-btn">Delete Order</button>
    `;
    result.appendChild(div);
    div.querySelector(".delete-btn").addEventListener("click",()=>{
      if(confirm("Are you sure you want to delete this order?")){
        orders=getOrders().filter(o=>o.id!==order.id); saveOrders(orders); div.remove();
      }
    });
  });
});
</script>
</body>
</html>
