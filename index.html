<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SHEIN BOOKING</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ====== BODY & CONTAINER ====== */
body {
  margin:0;
  font-family:'Baloo 2',cursive;
  background:#fdfdfd;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  min-height:100vh;
  padding:10px;
}

.container {
  background:#ffffff;
  padding:20px 15px;
  border-radius:20px;
  width:100%;
  max-width:480px;
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
  text-align:center;
  box-sizing:border-box;
  overflow:auto;
  max-height:95vh;
}

/* ====== TEXT & BUTTONS ====== */
h1 { color:#7b2e1f; margin-bottom:15px; font-size:24px; word-break:break-word; }
button {
  width:100%;
  padding:14px;
  margin:10px 0;
  border:none;
  border-radius:15px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(45deg,#8b3a2b,#a94432);
  color:white;
  transition:0.3s;
}
button:hover { transform: scale(1.03); }

/* ====== INPUTS ====== */
input, textarea, select {
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:12px;
  border:1.5px solid #d9a38f;
  outline:none;
  font-size:14px;
  box-sizing:border-box;
  font-family:'Baloo 2',cursive;
}
textarea { resize:vertical; min-height:50px; }

.sku-input {
  margin-bottom:8px;
  border-bottom:1px dashed #c58a74;
  padding-bottom:6px;
  display:flex;
  flex-direction:column;
  gap:5px;
}

.total-price {
  font-weight:bold;
  margin-top:8px;
  color:#8b3a2b;
  font-size:16px;
}

/* ====== QR IMAGE ====== */
img {
  max-width:100%;
  width:100%;
  height:auto;
  border-radius:15px;
  margin:10px 0;
  box-shadow:0 6px 15px rgba(0,0,0,0.2);
}

/* ====== PROCESSING SCREEN ====== */
.processing-screen {
  position:fixed;
  inset:0;
  background:rgba(92,44,31,0.95);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  color:white;
  font-size:22px;
  text-align:center;
  z-index:9999;
}
.loader {
  margin-top:20px;
  width:50px;
  height:50px;
  border:5px solid #fff;
  border-top:5px solid #ffccaa;
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin { 100% { transform: rotate(360deg); } }
.success { color:#ffe6cc; font-size:22px; margin-top:15px; }

/* ====== ADMIN ORDER ====== */
.admin-order {
  border-bottom:1px dashed #8b3a2b;
  padding:8px 0;
  text-align:left;
}
.admin-order input, .admin-order textarea {
  width:100%;
  margin:5px 0;
  padding:6px;
  border-radius:8px;
  border:1px solid #c58a74;
  font-family:'Baloo 2',cursive;
}
.confirm-btn { background:#7b2e1f; color:white; margin-top:5px; }
.delete-btn { background:#a94432; color:white; margin-top:5px; }

/* ====== MOBILE ====== */
@media(max-width:480px){
  h1 { font-size:20px; }
  button { font-size:14px; padding:12px; }
  .total-price { font-size:15px; }
  input, textarea, select { font-size:13px; padding:8px; }
  .container { padding:15px 10px; border-radius:15px; }
}
</style>
</head>
<body>

<!-- HOME -->
<div class="container" id="home">
  <h1>☕ SHEIN BOOKING 🤎</h1>
  <button id="btnPlace">Place Order</button>
  <button id="btnStatus">Check My Order</button>
  <button id="btnAdmin">Admin Panel</button>
</div>

<!-- PLACE ORDER -->
<div class="container" id="place" style="display:none;">
  <h1>🛍️ Place Order</h1>
  <input type="text" placeholder="Full Name" id="name" required>
  <input type="text" placeholder="Address" id="address" required>
  <input type="text" placeholder="Phone Number (11 digits)" id="phone" maxlength="11" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
  <input type="text" placeholder="Zip Code (max 5 digits)" id="zip" maxlength="5" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
  <textarea placeholder="Note for booking (optional)" id="note"></textarea>
  <input type="number" placeholder="How many items?" id="itemCount" min="1">
  <div id="skuInputs"></div>

  <div class="total-price" id="totalPrice">Total: ₱0</div>
  <p>Scan QR Code to Pay 💳</p>
  <img id="qrImage" src="https://i.imgur.com/PquwwgW.jpeg" alt="QR Code">
  <input type="text" placeholder="Enter Payment Reference Number" id="ref" required>
  <button id="btnSubmit">Submit Order</button>
  <button id="btnBackPlace">Back</button>
</div>

<!-- ORDER STATUS -->
<div class="container" id="status" style="display:none;">
  <h1>📦 Order Status</h1>
  <input type="text" placeholder="Enter Your Name" id="searchName">
  <button id="btnCheckStatus">Check</button>
  <div id="statusResult"></div>
  <button id="btnBackStatus">Back</button>
</div>

<!-- ADMIN PANEL -->
<div class="container" id="admin" style="display:none;">
  <h1>🔐 Admin Login</h1>
  <input type="password" placeholder="Admin Password" id="adminPassword" required>
  <button id="btnAdminLogin">Login</button>
  <button id="btnBackAdmin">Back</button>

  <div id="adminPanel" style="display:none;">
    <h3>Orders</h3>
    <div id="adminOrders"></div>
    <button id="btnChangePass">Change Password</button>
    <button id="btnAdminLogout">Logout</button>
  </div>
</div>

<!-- PROCESSING SCREEN -->
<div class="processing-screen" id="processingScreen">
  <div id="processingText">☕ PROCESSING PLEASE WAIT...</div>
  <div class="loader"></div>
  <div class="success" id="successText" style="display:none;">
    🤎 YOUR ORDER HAS BEEN SUBMITTED SUCCESSFULLY!
  </div>
</div>

<!-- JS remains the same as your original code -->
<script>
// navigation, submit, admin and status JS unchanged
// You can paste your JS here as-is from your previous code
</script>
</body>
</html>
